<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Student Management{% endblock %}</title>
  <style>
    :root {
      --bg: #f4efe7;
      --bg-strong: #efe4d4;
      --panel: rgba(255, 252, 247, 0.85);
      --panel-solid: #fffaf4;
      --text: #1f1a17;
      --muted: #6c6058;
      --line: rgba(64, 44, 29, 0.12);
      --primary: #a6482b;
      --primary-dark: #7e3019;
      --accent: #1d6b63;
      --accent-soft: #d8eee8;
      --warning: #b86a18;
      --danger: #9e2d2d;
      --shadow: 0 24px 60px rgba(74, 48, 34, 0.12);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --font-display: Georgia, "Times New Roman", serif;
      --font-body: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(166, 72, 43, 0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(29, 107, 99, 0.16), transparent 24%),
        linear-gradient(180deg, #f8f3ec 0%, var(--bg) 56%, #efe5d7 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 24px auto 40px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 22px;
      background: rgba(255, 250, 244, 0.72);
      border: 1px solid rgba(64, 44, 29, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 999px;
      box-shadow: 0 12px 32px rgba(78, 54, 39, 0.08);
      position: sticky;
      top: 18px;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), #d67b4e);
      color: white;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .brand-copy strong,
    .page-header h1,
    .section-title,
    .metric-card strong {
      font-family: var(--font-display);
    }

    .brand-copy small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav a {
      padding: 11px 16px;
      border-radius: 999px;
      color: var(--muted);
      font-weight: 700;
      transition: 0.2s ease;
    }

    .nav a:hover,
    .nav a.active {
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 24px rgba(66, 44, 33, 0.1);
    }

    .page {
      margin-top: 28px;
      display: grid;
      gap: 24px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      padding: 32px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(166, 72, 43, 0.92), rgba(76, 34, 25, 0.88));
      color: white;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .page-header::after {
      content: "";
      position: absolute;
      inset: auto -40px -60px auto;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }

    .page-header h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1;
    }

    .page-header p {
      margin: 10px 0 0;
      color: rgba(255, 246, 240, 0.88);
      max-width: 640px;
      font-size: 1.05rem;
    }

    .header-actions,
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn,
    button,
    input[type="submit"] {
      appearance: none;
      border: none;
      border-radius: 999px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn:hover,
    button:hover,
    input[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(45, 25, 16, 0.12);
    }

    .btn-primary,
    button,
    input[type="submit"] {
      background: linear-gradient(135deg, var(--primary), #d36a3d);
      color: white;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-light {
      background: #fff;
      color: var(--text);
      border: 1px solid rgba(64, 44, 29, 0.12);
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(64, 44, 29, 0.08);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .metrics-grid,
    .split-grid {
      display: grid;
      gap: 18px;
    }

    .metrics-grid {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    }

    .split-grid {
      grid-template-columns: 1.4fr 1fr;
    }

    .metric-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      background: var(--panel-solid);
      border: 1px solid var(--line);
    }

    .metric-card span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .metric-card strong {
      font-size: 2.2rem;
      line-height: 1;
    }

    .metric-card p {
      margin: 10px 0 0;
      color: var(--muted);
    }

    .section-title {
      margin: 0 0 16px;
      font-size: 1.45rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .search-form {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    input[type="search"],
    input[type="text"],
    input[type="email"],
    input[type="datetime-local"],
    textarea,
    select {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(64, 44, 29, 0.14);
      background: rgba(255, 255, 255, 0.88);
      font: inherit;
      color: var(--text);
    }

    textarea {
      resize: vertical;
    }

    .search-form .field-grow {
      flex: 1 1 280px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(64, 44, 29, 0.08);
      vertical-align: top;
    }

    th {
      color: #4e4037;
      font-size: 0.82rem;
      font-weight: 800;
      background: rgba(239, 228, 212, 0.65);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    td {
      color: var(--text);
    }

    td strong {
      color: var(--text);
    }

    .table-actions {
      white-space: nowrap;
    }

    .table-actions .btn {
      padding: 10px 14px;
      font-size: 0.92rem;
      box-shadow: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: #efe7dd;
      color: #5f4b3c;
    }

    .badge-success {
      background: #dcefe6;
      color: #1e6b52;
    }

    .badge-warning {
      background: #fff0d8;
      color: #9a5d10;
    }

    .badge-danger {
      background: #f8dddd;
      color: #972f2f;
    }

    .stack-list {
      display: grid;
      gap: 14px;
    }

    .stack-item {
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: var(--panel-solid);
      border: 1px solid var(--line);
    }

    .stack-item strong {
      display: block;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .stack-item p,
    .muted {
      margin: 0;
      color: var(--muted);
    }

    .empty-state {
      padding: 20px;
      border-radius: var(--radius-md);
      background: #fff5e8;
      border: 1px solid #f1d4ac;
      color: #7a5d3d;
    }

    .messages {
      display: grid;
      gap: 12px;
    }

    .message {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: #e6f4ec;
      color: #21593c;
      border: 1px solid #b9dcc6;
    }

    .form-grid {
      display: grid;
      gap: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .field .helptext {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .field .errorlist {
      margin: 8px 0 0;
      padding: 0;
      list-style: none;
      color: var(--danger);
      font-size: 0.92rem;
    }

    .progress {
      height: 14px;
      border-radius: 999px;
      background: #eadfd2;
      overflow: hidden;
    }

    .progress span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #49a195);
    }

    @media (max-width: 860px) {
      .topbar,
      .page-header {
        border-radius: 24px;
      }

      .split-grid {
        grid-template-columns: 1fr;
      }

      .page-header {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">SM</div>
        <div class="brand-copy">
          <strong>Student Management</strong>
          <small>Track students, coursework, and delivery</small>
        </div>
      </div>
      <nav class="nav">
        <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'student-list' %}" class="{% if request.resolver_match.url_name == 'student-list' %}active{% endif %}">Students</a>
        <a href="{% url 'assignment-list' %}" class="{% if request.resolver_match.url_name == 'assignment-list' or request.resolver_match.url_name == 'assignment-create' or request.resolver_match.url_name == 'assignment-update' %}active{% endif %}">Assignments</a>
        <a href="{% url 'admin:index' %}">Admin</a>
      </nav>
    </header>

    <main class="page">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div class="message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
