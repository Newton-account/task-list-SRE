<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignments</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 1200px; }
    .overdue { color: #d32f2f; font-weight: bold; }
    .due-soon { color: #f57c00; }
    .completed { text-decoration: line-through; color: #4caf50; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.75rem; border-bottom: 1px solid #eee; text-align: left; }
  </style>
</head>
<body>
  <h1>Assignments</h1>
  <a href="{% url 'assignment-create' %}">Create New Assignment</a>
  
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Student</th>
        <th>Due Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for assignment in assignments %}
        <tr class="{% if assignment.is_completed %}completed{% elif assignment.due_date < now %}overdue{% elif assignment.due_date < now|date:'+7 days' %}due-soon{% endif %}">
          <td>{{ assignment.title }}</td>
          <td>{{ assignment.student }}</td>
          <td>{{ assignment.due_date|date:"M j, Y g:i A" }}</td>
          <td>{% if assignment.is_completed %}Completed{% else %}Pending{% endif %}</td>
          <td><a href="{% url 'assignment-update' assignment.pk %}">Edit</a></td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
